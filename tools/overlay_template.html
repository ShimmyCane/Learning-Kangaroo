<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
  /* Written by tools/overlay.py from tools/overlay_template.html. Edit the template, not the output. */
  :root {
    --bg: #f6f2e8; --fg: #22201c; --muted: #6d675c; --accent: #e07a3f;
    --good: #2f9e72; --bad: #d4573b; --card: #ffffff; --line: #e4ddcc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --fg: #f3efe6; --muted: #a39c8e; --accent: #f08c55;
      --good: #5cc79a; --bad: #ef7a5e; --card: #26241f; --line: #3b3830;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17; --fg: #f3efe6; --muted: #a39c8e; --accent: #f08c55;
    --good: #5cc79a; --bad: #ef7a5e; --card: #26241f; --line: #3b3830;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding-block: 14px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 18px; margin: 0 0 12px; text-wrap: balance; }
  .intro { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  /* The paper is the worksheet's own drawing; the buttons sit on top of its boxes. */
  .paper { position: relative; margin: 0 0 18px; background: #fff; border-radius: 6px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(0,0,0,.08); overflow: hidden; }
  .paper svg.art { display: block; width: 100%; height: auto; }
  .hits, .marks { position: absolute; inset: 0; pointer-events: none; }
  .hit { position: absolute; pointer-events: auto; appearance: none; border: 0; background: transparent; border-radius: 12px; padding: 0; cursor: pointer; transition: background .12s, box-shadow .12s; }
  .hit:hover { background: rgba(224,122,63,.10); }
  .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hit[aria-pressed="true"] { background: rgba(224,122,63,.28); box-shadow: inset 0 0 0 4px var(--accent); }
  .hit.right { background: rgba(47,158,114,.22); box-shadow: inset 0 0 0 4px var(--good); }
  .hit.wrong { background: rgba(212,87,59,.22); box-shadow: inset 0 0 0 4px var(--bad); }
  .hit:disabled { cursor: default; }
  .mark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 18px/1 system-ui, sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .mark.good { background: var(--good); }
  .mark.bad { background: var(--bad); }

  /* Bottom bar: the one place to check. */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .status { font-size: 15px; color: var(--muted); }
  .btn { appearance: none; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700; border-radius: 12px; padding: 12px 18px; min-height: 46px; cursor: pointer; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .result h2 { font-size: 20px; margin: 0 0 8px; }
  .result ol { margin: 10px 0 0; padding-left: 22px; }
  .result li { margin: 6px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>__HEAD__</h1>
  <p class="intro">Tap a letter on the paper. When every question has an answer, press Check.</p>

  __PAGES__

  <section class="result hidden" id="result" aria-live="polite"></section>
</div>

<div class="bar">
  <div class="bar-in">
    <span class="status" id="status">0 of 4 answered</span>
    <span>
      <button class="btn ghost" id="again" type="button" hidden>Start again</button>
      <button class="btn" id="check" type="button" disabled>Check</button>
    </span>
  </div>
</div>

<script>
  const DATA = __DATA__;
  const LETTERS = __LETTERS__;
  const picks = {};
  let checked = false;

  const hits = [...document.querySelectorAll(".hit")];
  const total = DATA.length;
  const status = document.getElementById("status");
  const checkBtn = document.getElementById("check");
  const again = document.getElementById("again");
  const result = document.getElementById("result");

  function answered() { return Object.keys(picks).length; }

  function refresh() {
    status.textContent = checked ? "Checked" : `${answered()} of ${total} answered`;
    checkBtn.disabled = checked || answered() === 0;
    again.hidden = !checked && answered() === 0;
  }

  hits.forEach(btn => btn.addEventListener("click", () => {
    if (checked) return;
    const q = Number(btn.dataset.q), k = Number(btn.dataset.k);
    picks[q] = k;
    hits.filter(h => Number(h.dataset.q) === q).forEach(h => h.setAttribute("aria-pressed", h === btn ? "true" : "false"));
    refresh();
  }));

  // A badge sits on the right edge of a box, level with its middle. Its position comes from the box's own percentages.
  function badge(btn, kind, symbol) {
    const page = btn.closest(".paper");
    const marks = page.querySelector(".marks");
    const left = parseFloat(btn.style.left) + parseFloat(btn.style.width);
    const top = parseFloat(btn.style.top) + parseFloat(btn.style.height) / 2;
    const m = document.createElement("div");
    m.className = "mark " + kind;
    m.textContent = symbol;
    m.style.left = left + "%";
    m.style.top = top + "%";
    marks.appendChild(m);
  }

  checkBtn.addEventListener("click", () => {
    if (checked) return;
    checked = true;
    let right = 0, points = 0, max = 0;
    const lines = [];
    DATA.forEach((q, i) => {
      max += q.points;
      const pick = picks[i];
      const rightBtn = hits.find(h => Number(h.dataset.q) === i && Number(h.dataset.k) === q.answer);
      rightBtn.classList.add("right");
      badge(rightBtn, "good", "✓");
      let verdict;
      if (pick === undefined) {
        verdict = "no answer";
      } else if (pick === q.answer) {
        right++; points += q.points; verdict = "right";
      } else {
        const wrongBtn = hits.find(h => Number(h.dataset.q) === i && Number(h.dataset.k) === pick);
        wrongBtn.classList.add("wrong");
        badge(wrongBtn, "bad", "✗");
        verdict = "not this time";
      }
      lines.push(`<li><b>Question ${i + 1}</b> (${q.points} points): ${verdict}. ${q.why}</li>`);
    });
    result.innerHTML = `<h2>${right} of ${total} right · ${points} of ${max} points</h2><ol>${lines.join("")}</ol>`;
    result.classList.remove("hidden");
    hits.forEach(h => { h.disabled = true; });
    refresh();
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  again.addEventListener("click", () => {
    checked = false;
    for (const k of Object.keys(picks)) delete picks[k];
    hits.forEach(h => {
      h.disabled = false;
      h.classList.remove("right", "wrong");
      h.setAttribute("aria-pressed", "false");
    });
    document.querySelectorAll(".mark").forEach(m => m.remove());
    result.classList.add("hidden");
    result.innerHTML = "";
    refresh();
  });

  refresh();
</script>
</body>
</html>
