<style>
  /* Written by tools/overlay/overlay.py from overlay_template.html. Edit the template, not the output.
     No wrong answers: a wrong tap gets a hint and the child tries again. No score, no summary on the paper. */
  :root {
    --bg: #f6f2e8; --fg: #22201c; --muted: #6d675c; --accent: #e07a3f;
    --good: #2f9e72; --card: #ffffff; --line: #e4ddcc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --fg: #f3efe6; --muted: #a39c8e; --accent: #f08c55;
      --good: #5cc79a; --card: #26241f; --line: #3b3830;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17; --fg: #f3efe6; --muted: #a39c8e; --accent: #f08c55;
    --good: #5cc79a; --card: #26241f; --line: #3b3830;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding-block: 14px 190px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 18px; margin: 0 0 12px; text-wrap: balance; }
  .intro { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  /* The paper is the worksheet's own drawing; the buttons sit on top of its boxes. */
  .paper { position: relative; margin: 0 0 18px; background: #fff; border-radius: 6px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(0,0,0,.08); overflow: hidden; }
  .paper svg.art { display: block; width: 100%; height: auto; }
  .hits, .marks { position: absolute; inset: 0; pointer-events: none; }
  .hit { position: absolute; pointer-events: auto; appearance: none; border: 0; background: transparent; border-radius: 12px; padding: 0; cursor: pointer; transition: background .12s, box-shadow .12s; }
  .hit:hover { background: rgba(224,122,63,.10); }
  .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hit[aria-pressed="true"] { background: rgba(224,122,63,.22); box-shadow: inset 0 0 0 4px var(--accent); }
  .hit.tried { outline: 2px dashed var(--muted); outline-offset: -6px; }
  .hit.solved { background: rgba(47,158,114,.22); box-shadow: inset 0 0 0 4px var(--good); }
  .hit:disabled { cursor: default; }
  .hit:disabled:not(.solved) { opacity: .45; }
  .mark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--good); font: 700 18px/1 system-ui, sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.25); }

  /* Bottom bar: who is doing it, and the hint for the question that was tapped. */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar-in { max-width: 860px; margin: 0 auto; }
  .hint { margin: 0 0 10px; border-left: 5px solid var(--accent); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
  .hint small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .who { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .who-label { font-size: 14px; color: var(--muted); margin-right: 4px; }
  .chip { appearance: none; border: 2px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-weight: 600; border-radius: 999px; padding: 6px 12px; min-height: 40px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: rgba(224,122,63,.18); }
  .chip.done::after { content: " ✓"; color: var(--good); font-weight: 800; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .status { font-size: 14px; color: var(--muted); }
  .btn { appearance: none; border: 2px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-weight: 700; border-radius: 12px; padding: 8px 14px; min-height: 40px; cursor: pointer; }
  .hidden { display: none !important; }

  /* The explanation pops up only when the right answer is tapped again. */
  .pop-back { position: fixed; inset: 0; box-sizing: border-box; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .pop { box-sizing: border-box; width: min(480px, 100%); background: var(--card); color: var(--fg); border-radius: 16px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  .pop h2 { font-size: 18px; margin: 0 0 8px; }
  .pop p { margin: 0 0 16px; font-size: 17px; }
</style>

    try {
      const all = localAll();
      all[CODE] = Object.assign(all[CODE] || {}, { [childId]: true });

  }
  async function loadDone() {
    if (CHILDREN) return localDone();
    const c = await client();
    const { data, error } = await c.from("lkg_reviews").select("who").eq("code", CODE).eq("kind", "done");
    if (error) throw new Error(error.message);
    const out = {};
    data.forEach(r => { out[r.who] = true; });
    return Object.assign({}, localDone(), out);
  }
  async function saveDone(childId) {
    localSave(childId);
    if (CHILDREN) return "saved on this device";
    const c = await client();
    const now = new Date().toISOString();
    const { error } = await c.from("lkg_reviews").insert({ code: CODE, kind: "done", who: childId, status: "done", reason: "", note: "", created_at: now, updated_at: now });
    if (error && !/duplicate/i.test(error.message)) throw new Error(error.message);
    return "saved for " + (who ? who.name : "this child");
  }

  // ---- the child picker ----
  function drawWho(list) {
    childList = list;
    whoBox.innerHTML = `<span class="who-label">Who is doing this?</span>` +
      list.map(c => `<button class="chip${done[c.id] ? " done" : ""}" type="button" data-id="${c.id}" aria-pressed="${who && who.id === c.id}">${escapeHtml(c.name)}</button>`).join("");
    whoBox.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      who = list.find(c => c.id === b.dataset.id);
      drawWho(list);
      statusBox.textContent = done[who.id] ? who.name + " has done this one" : "";
    }));
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

  async function setupWho() {
    try {
      const list = await loadChildren();
      done = await loadDone();
      drawWho(list);
      if (!list.length) statusBox.textContent = "No family members found.";
    } catch (e) {
      whoBox.innerHTML = `<span class="who-label">The family list is not available here (${escapeHtml(e.message)}). Sign in on the home page, then open this sheet again.</span>`;
    }
  }

  // ---- the question flow ----
  function hintFor(i, n) { const list = DATA[i].hints; return list[Math.min(n - 1, list.length - 1)]; }

  function badge(btn) {
    const marks = btn.closest(".paper").querySelector(".marks");
    const m = document.createElement("div");
    m.className = "mark";
    m.textContent = "✓";
    m.style.left = (parseFloat(btn.style.left) + parseFloat(btn.style.width)) + "%";
    m.style.top = (parseFloat(btn.style.top) + parseFloat(btn.style.height) / 2) + "%";
    marks.appendChild(m);
  }

  function showHint(label, text) {
    hintBox.className = "hint";
    hintBox.innerHTML = `<small>${label}</small>${escapeHtml(text)}`;
  }

  function refreshStatus() {
    const count = Object.keys(solved).length;
    if (count < N) statusBox.textContent = count ? `${count} of ${N} solved` : "";
  }

  async function finish() {
    statusBox.textContent = "";
    if (!who) { statusBox.textContent = "Pick who did this to save it."; return; }
    try {
      const msg = await saveDone(who.id);
      done[who.id] = true;
      drawWho(childList);
      statusBox.textContent = msg;
    } catch (e) {
      statusBox.textContent = "Not saved yet (" + e.message + "). It is kept on this device.";
    }
  }

  hits.forEach(btn => btn.addEventListener("click", () => {
    const q = Number(btn.dataset.q), k = Number(btn.dataset.k);

    // the right answer, tapped again after it was found: the explanation pops up
    if (solved[q]) {
      if (k === DATA[q].answer) {
        document.getElementById("popTitle").textContent = "Question " + (q + 1);
        document.getElementById("popText").textContent = DATA[q].why;
        popBack.classList.remove("hidden");
        document.getElementById("popClose").focus();
      }
      return;
    }

    hits.filter(h => Number(h.dataset.q) === q).forEach(h => h.setAttribute("aria-pressed", h === btn ? "true" : "false"));

    if (k === DATA[q].answer) {
      // found: green, no pop-up yet
      solved[q] = true;
      btn.classList.add("solved");
      btn.classList.remove("tried");
      badge(btn);
      hits.filter(h => Number(h.dataset.q) === q && h !== btn).forEach(h => { h.disabled = true; h.classList.remove("tried"); });
      btn.setAttribute("aria-pressed", "false");
      hintBox.classList.add("hidden");
      refreshStatus();
      if (Object.keys(solved).length === N) finish();
      return;
    }

    // not this one: a hint, and the child picks again. Nothing is marked wrong.
    tries[q] = (tries[q] || 0) + 1;
    btn.classList.add("tried");
    btn.setAttribute("aria-pressed", "false");
    showHint(`Question ${q + 1} · hint ${Math.min(tries[q], DATA[q].hints.length)} of ${DATA[q].hints.length}`, hintFor(q, tries[q]));
    hintBox.classList.remove("hidden");
  }));

  document.getElementById("popClose").addEventListener("click", () => popBack.classList.add("hidden"));
  popBack.addEventListener("click", e => { if (e.target === popBack) popBack.classList.add("hidden"); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") popBack.classList.add("hidden"); });

  again.addEventListener("click", () => {
    for (const obj of [solved, tries]) for (const k of Object.keys(obj)) delete obj[k];
    hits.forEach(h => {
      h.disabled = false;
      h.classList.remove("tried", "solved");
      h.setAttribute("aria-pressed", "false");
    });
    document.querySelectorAll(".mark").forEach(m => m.remove());
    hintBox.classList.add("hidden");
    statusBox.textContent = "";
  });

  setupWho();
</script>
</body>
</html>
