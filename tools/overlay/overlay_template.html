<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>__TITLE__</title>
<style>
  /* Written by tools/overlay/overlay.py from overlay_template.html. Edit the template, not the output.
     No wrong answers here: a wrong tap gets a hint and the child tries again. */
  :root {
    --bg: #f6f2e8; --fg: #22201c; --muted: #6d675c; --accent: #e07a3f;
    --good: #2f9e72; --card: #ffffff; --line: #e4ddcc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --fg: #f3efe6; --muted: #a39c8e; --accent: #f08c55;
      --good: #5cc79a; --card: #26241f; --line: #3b3830;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17; --fg: #f3efe6; --muted: #a39c8e; --accent: #f08c55;
    --good: #5cc79a; --card: #26241f; --line: #3b3830;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding-block: 14px 150px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 18px; margin: 0 0 12px; text-wrap: balance; }
  .intro { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  /* The paper is the worksheet's own drawing; the buttons sit on top of its boxes. */
  .paper { position: relative; margin: 0 0 18px; background: #fff; border-radius: 6px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(0,0,0,.08); overflow: hidden; }
  .paper svg.art { display: block; width: 100%; height: auto; }
  .hits, .marks { position: absolute; inset: 0; pointer-events: none; }
  .hit { position: absolute; pointer-events: auto; appearance: none; border: 0; background: transparent; border-radius: 12px; padding: 0; cursor: pointer; transition: background .12s, box-shadow .12s; }
  .hit:hover { background: rgba(224,122,63,.10); }
  .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hit[aria-pressed="true"] { background: rgba(224,122,63,.22); box-shadow: inset 0 0 0 4px var(--accent); }
  .hit.tried { outline: 2px dashed var(--muted); outline-offset: -6px; }
  .hit.solved { background: rgba(47,158,114,.22); box-shadow: inset 0 0 0 4px var(--good); }
  .hit:disabled { cursor: default; }
  .hit.solved:disabled, .hit.tried:disabled { opacity: 1; }
  .hit:disabled:not(.solved) { opacity: .45; }
  .mark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--good); font: 700 18px/1 system-ui, sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.25); }

  /* Bottom bar: hints appear here, above the status line. */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar-in { max-width: 860px; margin: 0 auto; }
  .hint { max-width: 860px; margin: 0 auto 10px; border-left: 5px solid var(--accent); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
  .hint.ok { border-left-color: var(--good); }
  .hint small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .status { font-size: 15px; color: var(--muted); }
  .btn { appearance: none; border: 2px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-weight: 700; border-radius: 12px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
  .hidden { display: none !important; }

  .result { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .result h2 { font-size: 20px; margin: 0 0 8px; }
  .result ol { margin: 10px 0 0; padding-left: 22px; }
  .result li { margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>__HEAD__</h1>
  <p class="intro">Tap a letter on the paper. If it is not the one, a hint will help you pick again.</p>

  __PAGES__

  <section class="result hidden" id="result" aria-live="polite"></section>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="hint hidden" id="hint" role="status" aria-live="polite"></div>
    <div class="row">
      <span class="status" id="status"></span>
      <button class="btn" id="again" type="button">Start again</button>
    </div>
  </div>
</div>

<script>
  // Each question: its answer (index 0-4), its hints in order, and the explanation shown once it is solved.
  const DATA = __DATA__;
  const N = DATA.length;
  const solved = {};   // question index -> true
  const tries = {};    // question index -> number of wrong taps so far
  const firstTry = {}; // question index -> true when the first tap was right
  const hits = [...document.querySelectorAll(".hit")];
  const status = document.getElementById("status");
  const hintBox = document.getElementById("hint");
  const result = document.getElementById("result");
  const again = document.getElementById("again");

  function hintFor(i, n) {
    const list = DATA[i].hints;
    return list[Math.min(n - 1, list.length - 1)];
  }

  function refresh() {
    const count = Object.keys(solved).length;
    status.textContent = count === N ? "All done" : `${count} of ${N} solved`;
    again.classList.toggle("hidden", count === 0 && !Object.keys(tries).length);
  }

  function showHint(text, label, ok) {
    hintBox.className = "hint" + (ok ? " ok" : "");
    hintBox.innerHTML = `<small>${label}</small>${text}`;
  }

  // A badge sits on the right edge of a box, level with its middle. Its position comes from the box's own percentages.
  function badge(btn) {
    const marks = btn.closest(".paper").querySelector(".marks");
    const m = document.createElement("div");
    m.className = "mark";
    m.textContent = "✓";
    m.style.left = (parseFloat(btn.style.left) + parseFloat(btn.style.width)) + "%";
    m.style.top = (parseFloat(btn.style.top) + parseFloat(btn.style.height) / 2) + "%";
    marks.appendChild(m);
  }

  function finishIfDone() {
    if (Object.keys(solved).length !== N) return;
    const first = Object.keys(firstTry).length;
    const lines = DATA.map((q, i) => `<li><b>Question ${i + 1}</b>: ${q.why}</li>`).join("");
    result.innerHTML = `<h2>All ${N} solved</h2><p>${first} of ${N} on the first try.</p><ol>${lines}</ol>`;
    result.classList.remove("hidden");
    hintBox.classList.add("hidden");
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  hits.forEach(btn => btn.addEventListener("click", () => {
    const q = Number(btn.dataset.q), k = Number(btn.dataset.k);
    if (solved[q]) return;
    hits.filter(h => Number(h.dataset.q) === q).forEach(h => h.setAttribute("aria-pressed", h === btn ? "true" : "false"));

    if (k === DATA[q].answer) {
      solved[q] = true;
      if (!tries[q]) firstTry[q] = true;
      btn.classList.add("solved");
      badge(btn);
      hits.filter(h => Number(h.dataset.q) === q).forEach(h => { h.disabled = true; h.classList.remove("tried"); });
      showHint(DATA[q].why, `Question ${q + 1} · yes!`, true);
      refresh();
      finishIfDone();
      return;
    }

    // Not this one: a hint, and the child picks again. Nothing is marked wrong.
    tries[q] = (tries[q] || 0) + 1;
    btn.classList.add("tried");
    btn.setAttribute("aria-pressed", "false");
    const hint = hintFor(q, tries[q]);
    showHint(hint, `Question ${q + 1} · hint ${Math.min(tries[q], DATA[q].hints.length)} of ${DATA[q].hints.length}`, false);
    refresh();
  }));

  again.addEventListener("click", () => {
    for (const obj of [solved, tries, firstTry]) for (const k of Object.keys(obj)) delete obj[k];
    hits.forEach(h => {
      h.disabled = false;
      h.classList.remove("tried", "solved");
      h.setAttribute("aria-pressed", "false");
    });
    document.querySelectorAll(".mark").forEach(m => m.remove());
    result.classList.add("hidden");
    result.innerHTML = "";
    hintBox.classList.add("hidden");
    refresh();
  });

  refresh();
</script>
</body>
</html>
